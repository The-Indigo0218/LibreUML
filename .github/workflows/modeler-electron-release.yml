name: Modeler Electron Release

# Triggers on tags shaped `modeler-v*.*.*` (e.g. `modeler-v1.5.0`).
# Builds Electron bundles for Linux, macOS and Windows in parallel,
# then publishes them to a GitHub Release.
on:
  push:
    tags:
      - 'modeler-v*.*.*'

permissions:
  contents: write   # required by softprops/action-gh-release

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build --workspace=apps/modeler

      - name: Package Electron app
        run: npm run dist --workspace=apps/modeler
        env:
          # Tells electron-builder not to publish to GitHub itself —
          # we let the action below upload the artifacts.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/modeler/release/*.AppImage
            apps/modeler/release/*.exe
            apps/modeler/release/*.dmg
            apps/modeler/release/*.snap
            apps/modeler/release/*.deb
          # Release name is the tag (modeler-vX.Y.Z); body is autogenerated from PRs.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
